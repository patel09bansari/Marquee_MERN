<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <!-- Font Awesome CDN for Social Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Card Container */
    .profile-card {
      background: #ffffff;
      width: 320px;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }

    /* Options Menu (Three Dots) */
    .menu-icon {
      position: absolute;
      top: 18px;
      right: 20px;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
    }

    /* Animated Avatar Section */
    .pro-img {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
    }

    .pro-img1 {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      /* Continuous floating animation */
      animation: float 3s ease-in-out infinite;
    }

    /* Verified Badge Animation */
    .status {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background-color: #2ecc71;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      /* Pulsing glow animation */
      animation: pulse 2s infinite;
    }

    /* User Info */
    .user-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 4px;
    }

    .user-title {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    /* Stats Section */
    .stats-container {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 18px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
    }

    /* Bio Text */
    .user-bio {
      font-size: 0.78rem;
      color: #777;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* Social Icons with Hover Transitions */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      /* Smooth Hover Transition */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .social-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 12px rgba(197, 14, 14, 0.2);
      background-color: red;
    }

    .twitter   { background-color: #1da1f2; }
    .facebook  { background-color: #3b5998; }
    .google    { background-color: #ea4335; }
    .linkedin  { background-color: #0077b5; }

    /* Main Action Button with Hover Transition */
    .btn-profile {
      display: inline-block;
      width: 80%;
      padding: 12px 0;
      background: linear-gradient(135deg, #1abc9c, #16a085);
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(26, 188, 156, 0.3);
      /* Smooth Hover Transition */
      transition: all 0.3s ease;
    }

    .btn-profile:hover {
      background: linear-gradient(135deg, #16a085, #117a65);
      box-shadow: 0 8px 20px rgba(26, 188, 156, 0.5);
      transform: translateY(-2px);
    }

    /* Animation Keyframes */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(46, 204, 113, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
      }
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Menu Icon -->
    <i class="fa-solid fa-ellipsis-vertical menu-icon"></i>

    <!-- Profile Image & Badge -->
    <div class="pro-img">
<img class="pro-img1" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&auto=format&fit=crop" alt="Profile Picture">
      <div class="status">
        <i class="fa-solid fa-check"></i>
      </div>
    </div>

    <!-- User Information -->
    <h2 class="user-name">Bansari Patel</h2>
    <p class="user-title">Developer & Designer</p>

    <!-- Stats -->
    <div class="stats-container">
      <div class="stat-box">
        <span class="stat-label">Projects</span>
        <span class="stat-value">11</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Following</span>
        <span class="stat-value">250</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Followers</span>
        <span class="stat-value">185</span>
      </div>
    </div>

    <!-- Description -->
    <p class="user-bio">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed et est et velit ornare ultrices.
    </p>

    <!-- Social Buttons -->
    <div class="social-icons">
      <a href="#" class="social-btn twitter"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" class="social-btn facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="social-btn google"><i class="fa-brands fa-google-plus-g"></i></a>
      <a href="#" class="social-btn linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>

    <!-- Action Button -->
    <button class="btn-profile">View Profile</button>
  </div>

</body>
</html>
