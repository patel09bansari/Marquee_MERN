<!DOCTYPE html>
<html>
<head>
    <title>Bansari Patel</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="portfolio-card.css">
</head>
<body>

<div class="card">

    <div class="header"></div>

    <!-- Wrapper for Profile Image + Circular Skill Badges -->
    <div class="profile-container">
        <!-- Dashed outer ring -->
        <div class="skill-ring"></div>

        <!-- Floating Skill Badges -->
        <div class="skill-item skill-mern">
            <i class="fa-solid fa-laptop-code"></i>
            <span>MERN</span>
        </div>
        <div class="skill-item skill-algo">
            <i class="fa-solid fa-diagram-project"></i>
            <span>Algorithms</span>
        </div>
        <div class="skill-item skill-dsa">
            <i class="fa-solid fa-sitemap"></i>
            <span>Data Structures</span>
        </div>
        <div class="skill-item skill-projects">
            <i class="fa-solid fa-lightbulb"></i>
            <span>Projects</span>
        </div>
        <div class="skill-item skill-aptitude">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Aptitude</span>
        </div>

        <!-- Original Profile Image -->
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&auto=format&fit=crop" class="profile" alt="Profile">
    </div>

    <h2>Bansari Patel</h2>

    <p>YouTuber & Blogger</p>

    <div class="icons">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <button>Subscribe</button>
    <button>Message</button>

    <div class="footer">
        <span><i class="fa-regular fa-heart"></i> 60.4k</span>
        <span><i class="fa-regular fa-comment"></i> 20k</span>
        <span><i class="fa-solid fa-share"></i> 12.4k</span>
    </div>
</div>

</body>
</html>
